[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-monitor"
version = "0.1.0"
description = "See how many pull requests merge each day, who authors them, and who merges them, for GitHub, GitLab, Bitbucket, or a local git checkout."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "mabid" }]
dependencies = ['tzdata; sys_platform == "win32"']
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/mabid/dev-monitor"
Issues = "https://github.com/mabid/dev-monitor/issues"

[project.scripts]
dev-monitor = "dev_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dev_monitor = ["dashboard.html"]
